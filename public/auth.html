<!doctype html>
<html lang="en" class="ak-base ak-native">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>bujo</title>

  <!-- From app-kit head.html (v0.7.0). The theme-color colours are bujo's page colours: dark #000000, light #ffffff. -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark) and (max-width: 719px)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light) and (max-width: 719px)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- A token in the URL fragment never goes to another site, but keep it out of referrers anyway. -->
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="/manifest.webmanifest?v=1">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <link rel="stylesheet" href="/app-kit/ak-tokens.css">
  <link rel="stylesheet" href="/app-kit/ak-base.css">
  <link rel="stylesheet" href="/app-kit/ak-components.css">
  <link rel="stylesheet" href="/app-kit/ak-native.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- One page for /signup, /signin, /lost, /verify and /recover. js/auth.js picks the screen from the path. -->
  <main id="app" class="bj-app" aria-live="polite"></main>

  <script src="/app-kit/theme-color.js"></script>
  <script src="/app-kit/ak-dom.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
