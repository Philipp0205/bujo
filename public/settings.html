<!doctype html>
<html lang="en" class="ak-base ak-native">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>bujo settings</title>

  <!-- Sets the saved theme before the first paint (an external file: the CSP blocks inline scripts). -->
  <script src="/js/theme/boot.js"></script>
  <script src="/js/font/boot.js"></script>

  <!-- From app-kit head.html (v0.7.0). The theme-color colours are the paper colours: dark #16130f, light #f4efe4. -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark) and (max-width: 719px)">
  <meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light) and (max-width: 719px)">
  <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest?v=1">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <link rel="stylesheet" href="/app-kit/ak-tokens.css">
  <link rel="stylesheet" href="/app-kit/ak-base.css">
  <link rel="stylesheet" href="/app-kit/ak-components.css">
  <link rel="stylesheet" href="/app-kit/ak-native.css">
  <!-- The paper look comes last, so its colours win over the kit tokens. -->
  <link rel="stylesheet" href="/css/paper.css">
  <link rel="stylesheet" href="/css/sheet.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/whats-new.css">
  <link rel="stylesheet" href="/css/tabs.css">
</head>
<body>
  <div class="paper">
    <main id="app" class="bj-app" aria-live="polite"></main>
  </div>

  <script src="/app-kit/theme-color.js"></script>
  <script src="/app-kit/ak-dom.js"></script>
  <script src="/app-kit/ak-sheet.js"></script>
  <script src="/app-kit/ak-nav.js"></script>
  <script src="/app-kit/ak-tabbar.js"></script>
  <script src="/app-kit/ak-swr.js"></script>
  <script src="/app-kit/ak-toast.js"></script>
  <script src="/app-kit/ak-whats-new.js"></script>
  <script src="/app-kit/ak-sw-register.js"></script>
  <script src="/js/log/ink/path.js"></script>
  <script src="/js/log/ink/decorate.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/nav/overlays.js"></script>
  <script src="/js/nav/page-back.js"></script>
  <script src="/js/nav/copy.js"></script>
  <script src="/js/nav/icons.js"></script>
  <script src="/js/nav/data.js"></script>
  <script src="/js/nav/pages.js"></script>
  <script src="/js/nav/tabs.js"></script>
  <script src="/js/nav/router.js"></script>
  <script src="/js/whats-new/copy.js"></script>
  <script src="/js/whats-new/catalog.js"></script>
  <script src="/js/whats-new/seen.js"></script>
  <script src="/js/whats-new/sheet.js"></script>
  <script src="/js/whats-new/boot.js"></script>
  <script src="/js/whats-new/settings-row.js"></script>
  <script src="/js/theme/copy.js"></script>
  <script src="/js/theme/section.js"></script>
  <script src="/js/font/copy.js"></script>
  <script src="/js/font/section.js"></script>
  <script src="/js/settings.js"></script>
</body>
</html>
